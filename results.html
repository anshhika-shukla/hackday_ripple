const NOTES = {
  boltons: "boltons keeps one test file per module, so simply guessing tests from file names also does well here. RIPPLE follows the actual code connections, which also finds tests in other files.",
  click: "Click connects its pieces while the program runs, which a code map built from reading the source can't see, so following the map alone catches very few bugs. RIPPLE notices this and plays safe: it runs nearly every test instead of guessing. No time saved on Click, but bugs don't slip through quietly.",
  mini_app: "This app is tiny (8 tests), so every approach catches nearly every bug. It's here to show the whole flow end to end, not to compare approaches.",
};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = v => `${Number(v).toLocaleString(undefined, {maximumFractionDigits: 1})}%`;
const shortTest = t => t ? t.split("::").slice(1).join(" › ") : "";

function bars(rows, fmt) {
  const max = Math.max(...rows.map(r => r.value), 1);
  return `<div class="bars">${rows.map(r => `
    <div class="bar-row${r.hl ? " hl" : ""}">
      <div class="name">${esc(r.name)}</div>
      <div class="track" title="${esc(r.name)}: ${esc(fmt(r))}">
        <div class="fill" style="width:${(78 * r.value / max).toFixed(1)}%"></div>
        <span class="val" style="left:${(78 * r.value / max).toFixed(1)}%">${esc(fmt(r))}</span>
      </div>
    </div>`).join("")}</div>`;
}

function bugDetail(t, b) {
  const verdict = b.caught
    ? `<span class="verdict ok">✓ Caught.</span> RIPPLE ran ${b.tests_run} of ${t.suite_size} tests, and <code>${esc(shortTest(b.caught_by))}</code> failed, exposing the bug.`
    : `<span class="verdict no">✗ Missed.</span> RIPPLE ran ${b.tests_run} of ${t.suite_size} tests, but none of the ${b.tests_failing} test${b.tests_failing === 1 ? "" : "s"} that catch this bug were among them.`;
  return `<h3>Bug #${b.id} in <code>${esc(b.function)}</code> <span style="font-weight:400;color:var(--ink-2)">(${esc(b.file)}) · ${esc(b.kind)}</span></h3>
    <div class="code"><span class="del">- ${esc(b.before)}</span>\n<span class="add">+ ${esc(b.after)}</span></div>
    <div>${verdict}</div>`;
}

function render(key) {
  const t = DATA.find(d => d.key === key) || DATA[0];
  document.querySelectorAll(".tab").forEach(el => el.setAttribute("aria-selected", el.dataset.key === t.key));
  const s = t.strategies;
  const missed = t.bugs.length - t.caught;

  const approaches = [
    {name: "Run every test", caught: 100, run: 100, note: "catches every bug a test can catch, by definition"},
    s.A && {name: "Guess from file names", caught: s.A.catch_rate, run: s.A.mean_selection_ratio},
    s.B_graph_only && {name: "Follow the code map only", caught: s.B_graph_only.catch_rate, run: s.B_graph_only.mean_selection_ratio},
    {name: "RIPPLE", caught: t.catch_rate, run: t.tests_run_pct, hl: true},
  ].filter(Boolean);

  let ai = "";
  if (s.C && s.B) {
    const withAi = s.C.recall_at_3, without = s.B.recall_at_3;
    const verdict = withAi > without ? "improved it a little" : withAi < without ? "did not improve it" : "made no difference";
    ai = `<p class="sub" style="margin-top:14px">The local AI model (Qwen3, 4B, on the laptop GPU) writes the plain-English change summary and risk rating. It also re-orders the chosen tests so likely failures run first; on ${esc(t.title)} that ${verdict} (a failing test in the first 3: ${pct(withAi)} with AI vs ${pct(without)} without). It never removes a test, so it can't make RIPPLE miss a bug. Repeated ${t.model_runs} times with identical results.</p>`;
  }

  let demo = "";
  if (t.demo) {
    const d = t.demo, r = d.results || {}, tri = d.triage || {}, tm = d.timing || {};
    const ch = (d.changed || [])[0] || {};
    const cases = (r.passed || 0) + (r.failed || 0) + (r.skipped || 0);  // functions expand into pytest cases
    const caught = (r.failed_ids || []).map(id => `<code>${esc(shortTest(id))}</code>`).join(", ");
    const model = d.llm_status === "ok" && tri.summary
      ? `Risk ${esc(tri.risk)}/5. “${esc(tri.summary)}”`
      : "Model not used in this run; tests were ordered by the code map only.";
    const time = [["graph_s", "finding tests"], ["llm_s", "AI"], ["tests_s", "running them"]]
      .filter(([k]) => k in tm).map(([k, l]) => `${l} ${tm[k].toFixed(2)} s`).join(" · ");
    demo = `<section>
      <h2>Live demo: one bug, start to finish</h2>
      <p class="sub">What <code>bash scripts/demo.sh${t.key === "boltons" ? "" : " " + esc(t.key)}</code> did in its last real run.</p>
      <div class="demo-steps">
        <div class="step"><div class="n">1 · The change</div>A one-line bug in <code>${esc(ch.qualname)}</code> (${esc(ch.file)}):
          <div class="code"><span class="del">- ${esc(d.before)}</span>\n<span class="add">+ ${esc(d.after)}</span></div></div>
        <div class="step"><div class="n">2 · Tests chosen</div><div class="tile" style="border:0;padding:0;background:none"><div class="v">${d.selected} <span style="font-size:18px;font-weight:400">test functions</span></div><div class="d">pytest ran ${cases} of ${d.suite_total} test cases (${pct(100 * cases / Math.max(d.suite_total, 1))})</div></div></div>
        <div class="step"><div class="n">3 · Result</div>${r.failed ? `<span class="verdict ok">✓ Bug caught</span> by ${caught}` : `<span class="verdict no">No test failed</span>`}<div class="d" style="margin-top:6px;color:var(--ink-2);font-size:14px">${esc(time)}</div></div>
        <div class="step"><div class="n">4 · The AI's read</div>${model}</div>
      </div>
      ${d.map ? `<a class="btn" href="${esc(d.map)}">See how this change spreads through the code →</a>` : ""}
    </section>`;
  }

  document.getElementById("panel").innerHTML = `
    <section>
      <p class="sub" style="margin-bottom:6px">${esc(t.about)}</p>
      <p class="lead">We planted <strong>${t.bugs.length} bugs</strong> in ${esc(t.title)}, one at a time. For each one RIPPLE chose which tests to run. It caught <strong>${t.caught} of ${t.bugs.length}</strong> while running <strong>${pct(t.tests_run_pct)}</strong> of the tests.</p>
      <div class="tiles">
        <div class="tile"><div class="k">Bugs caught</div><div class="v">${pct(t.catch_rate)}</div><div class="d">${t.caught} of ${t.bugs.length} planted bugs</div></div>
        <div class="tile"><div class="k">Tests run per change</div><div class="v">${pct(t.tests_run_pct)}</div><div class="d">about ${t.tests_run_avg} of ${t.suite_size} tests</div></div>
        <div class="tile"><div class="k">Bugs missed</div><div class="v">${missed}</div><div class="d">${missed ? "a test could have caught them, but it wasn't picked" : "none"}</div></div>
      </div>
    </section>

    <section>
      <h2>How much of the test suite runs</h2>
      <p class="sub">Average number of tests run for each change.</p>
      ${bars([{name: "Run every test", value: t.suite_size}, {name: "RIPPLE", value: t.tests_run_avg, hl: true}],
             r => r.hl ? `about ${r.value} tests (${pct(t.tests_run_pct)})` : `${r.value} tests`)}
    </section>

    <section>
      <h2>Every planted bug</h2>
      <p class="sub">Each square is one bug. Click a square to see the change and what RIPPLE did.</p>
      <div class="legend"><span><i style="background:var(--ripple);color:var(--on-fill)">✓</i>Caught by the tests RIPPLE ran</span><span><i style="box-shadow:inset 0 0 0 2px var(--missed);color:var(--missed)">✗</i>Missed</span></div>
      <div class="grid-bugs" id="bugs">${t.bugs.map((b, i) => `<button class="bug ${b.caught ? "caught" : "missed"}" data-i="${i}" aria-pressed="false" aria-label="Bug ${b.id} in ${esc(b.function)}: ${b.caught ? "caught" : "missed"}" title="Bug #${b.id} in ${esc(b.function)} · ${b.caught ? "caught" : "missed"}">${b.caught ? "✓" : "✗"}</button>`).join("")}</div>
      <div class="detail" id="detail" aria-live="polite"></div>
    </section>

    <section>
      <h2>Compared with simpler ways to choose tests</h2>
      <p class="sub">Same planted bugs, different ways of picking which tests to run.</p>
      <div class="compare">
        <div><h3>Bugs caught (higher is better)</h3>${bars(approaches.map(a => ({...a, value: a.caught})), r => pct(r.value))}</div>
        <div><h3>Share of tests run (lower is faster)</h3>${bars(approaches.map(a => ({...a, value: a.run})), r => pct(r.value))}</div>
      </div>
      <details><summary>Show as a table</summary>
        <table><thead><tr><th>Approach</th><th>Bugs caught</th><th>Tests run</th></tr></thead>
        <tbody>${approaches.map(a => `<tr><td>${esc(a.name)}${a.note ? ` <span style="color:var(--muted)">(${esc(a.note)})</span>` : ""}</td><td>${pct(a.caught)}</td><td>${pct(a.run)}</td></tr>`).join("")}</tbody></table>
      </details>
      <p class="note" style="margin-top:16px">${esc(NOTES[t.key] || "")}</p>
      ${ai}
    </section>
    ${demo}`;

  const detail = document.getElementById("detail");
  const buttons = [...document.querySelectorAll(".bug")];
  const select = i => {
    buttons.forEach(b => b.setAttribute("aria-pressed", b.dataset.i == i));
    detail.innerHTML = bugDetail(t, t.bugs[i]);
  };
  buttons.forEach(b => b.addEventListener("click", () => select(b.dataset.i)));
  if (buttons.length) select(0);

  document.getElementById("footer").innerHTML =
    `${esc(t.title)}: ${t.planted} bugs planted, ${t.planted - t.bugs.length} left out because even the full test suite didn't notice them. ` +
    `“Tests” means test functions (${t.suite_size} in ${esc(t.title)}); the live demo counts pytest test cases. ` +
    `Numbers from <code>eval/results/${esc(t.key)}/</code>, rebuilt by <code>scripts/build_results.py</code>.`;
  if (location.hash !== "#" + t.key) history.replaceState(null, "", "#" + t.key);
}

const tabs = document.getElementById("tabs");
tabs.innerHTML = DATA.map(d => `<button class="tab" role="tab" data-key="${d.key}">${esc(d.title)}<small>${pct(d.catch_rate)} caught · ${pct(d.tests_run_pct)} run</small></button>`).join("");
tabs.addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) render(b.dataset.key); });
document.addEventListener("keydown", e => {
  if (!["ArrowLeft", "ArrowRight"].includes(e.key) || e.target.closest("input, textarea")) return;
  const keys = DATA.map(d => d.key), cur = keys.indexOf(location.hash.slice(1));
  render(keys[(Math.max(cur, 0) + (e.key === "ArrowRight" ? 1 : keys.length - 1)) % keys.length]);
});
window.addEventListener("hashchange", () => render(location.hash.slice(1)));

const themeBtn = document.getElementById("theme");
const isDark = () => document.documentElement.dataset.theme === "dark" ||
  (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
const syncTheme = () => { themeBtn.textContent = isDark() ? "Light mode" : "Dark mode"; };
themeBtn.addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("ripple-theme", next); } catch (e) {}
  syncTheme();
});
try { const saved = localStorage.getItem("ripple-theme"); if (saved) document.documentElement.dataset.theme = saved; } catch (e) {}
syncTheme();

render(location.hash.slice(1) || "boltons");
