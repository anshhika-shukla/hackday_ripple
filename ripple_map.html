<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RIPPLE Impact Map</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: #38bdf8;
    }
    .stat-badge {
      font-size: 16px;
      font-weight: 600;
      background: #1e293b;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .legend {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .container {
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌊 RIPPLE Code Ripple Map</h1>
    <div class="stat-badge">
      <strong>4</strong> of <strong>17</strong> tests selected (76% reduction)
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="dot" style="background:#ef4444"></span> Changed Symbol (Origin)</div>
    <div class="legend-item"><span class="dot" style="background:#f59e0b"></span> Impacted Function / Method</div>
    <div class="legend-item"><span class="dot" style="background:#10b981"></span> Selected Test Case</div>
  </div>

  <div class="container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="650" style="background-color: #111827; border-radius: 8px;">
      <!-- Edges -->
      <g id="edges" stroke="#374151" stroke-width="1.8" stroke-opacity="0.7">
        <line x1="500" y1="320" x2="300" y2="200" />
        <line x1="500" y1="320" x2="700" y2="200" />
        <line x1="500" y1="320" x2="500" y2="480" />
        <line x1="300" y1="200" x2="160" y2="120" />
        <line x1="700" y1="200" x2="840" y2="120" />
        <line x1="700" y1="200" x2="840" y2="280" />
      </g>

      <!-- Nodes -->
      <g id="nodes">
        <!-- Changed Node: pricing.py::apply_discount -->
        <circle cx="500" cy="320" r="16" fill="#ef4444" stroke="#111827" stroke-width="2">
          <title>Changed Symbol: pricing.apply_discount (pricing.py::apply_discount)</title>
        </circle>

        <!-- Direct Caller: tests/test_pricing.py::test_apply_discount -->
        <circle cx="500" cy="480" r="14" fill="#10b981" stroke="#111827" stroke-width="2">
          <title>Selected Test: test_apply_discount (tests/test_pricing.py::test_apply_discount)</title>
        </circle>

        <!-- Intermediate: cart.py::Cart.get_total -->
        <circle cx="300" cy="200" r="11" fill="#f59e0b" stroke="#111827" stroke-width="2">
          <title>Impacted Node: cart.Cart.get_total (cart.py::Cart.get_total)</title>
        </circle>

        <!-- Selected Test: tests/test_cart.py::test_cart_total -->
        <circle cx="160" cy="120" r="14" fill="#10b981" stroke="#111827" stroke-width="2">
          <title>Selected Test: test_cart_total (tests/test_cart.py::test_cart_total)</title>
        </circle>

        <!-- Intermediate: pricing.py::get_final_price -->
        <circle cx="700" cy="200" r="11" fill="#f59e0b" stroke="#111827" stroke-width="2">
          <title>Impacted Node: pricing.get_final_price (pricing.py::get_final_price)</title>
        </circle>

        <!-- Selected Test: tests/test_pricing.py::test_get_final_price -->
        <circle cx="840" cy="120" r="14" fill="#10b981" stroke="#111827" stroke-width="2">
          <title>Selected Test: test_get_final_price (tests/test_pricing.py::test_get_final_price)</title>
        </circle>

        <!-- Selected Test: tests/test_checkout.py::test_checkout_process -->
        <circle cx="840" cy="280" r="14" fill="#10b981" stroke="#111827" stroke-width="2">
          <title>Selected Test: test_checkout_process (tests/test_checkout.py::test_checkout_process)</title>
        </circle>
      </g>

      <!-- Labels -->
      <g id="labels" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f3f4f6" text-anchor="middle">
        <text x="500" y="296" fill="#fca5a5">pricing.apply_discount (CHANGED)</text>
        <text x="500" y="510" fill="#86efac">test_apply_discount (dist=1)</text>
        <text x="300" y="180" fill="#fde68a">Cart.get_total</text>
        <text x="160" y="100" fill="#86efac">test_cart_total (dist=2)</text>
        <text x="700" y="180" fill="#fde68a">get_final_price</text>
        <text x="840" y="100" fill="#86efac">test_get_final_price (dist=2)</text>
        <text x="840" y="310" fill="#86efac">test_checkout_process (dist=3)</text>
      </g>
    </svg>
  </div>
</body>
</html>
