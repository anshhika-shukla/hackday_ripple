<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Graphify - RIPPLE Code Graph</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #38bdf8;
    }
    .meta {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .graph-box {
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      background: #111827;
    }
  </style>
</head>
<body>
  <h1>Graphify Code Graph: RIPPLE</h1>
  <div class="meta">Extracted with <code>graphify extract . --code-only</code> | Offline Graph Explorer</div>

  <div class="graph-box">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="600">
      <!-- Edges -->
      <line x1="480" y1="300" x2="200" y2="150" stroke="#475569" stroke-width="2" />
      <line x1="480" y1="300" x2="350" y2="120" stroke="#475569" stroke-width="2" />
      <line x1="480" y1="300" x2="600" y2="150" stroke="#475569" stroke-width="2" />
      <line x1="480" y1="300" x2="750" y2="200" stroke="#475569" stroke-width="2" />
      <line x1="600" y1="150" x2="750" y2="100" stroke="#475569" stroke-width="2" />
      <line x1="480" y1="300" x2="480" y2="450" stroke="#475569" stroke-width="2" />
      <line x1="200" y1="450" x2="200" y2="150" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4" />
      <line x1="350" y1="480" x2="750" y2="100" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4" />
      <line x1="650" y1="480" x2="600" y2="150" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4" />
      <line x1="800" y1="450" x2="480" y2="300" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4" />

      <!-- Nodes -->
      <!-- CLI (Center) -->
      <circle cx="480" cy="300" r="18" fill="#38bdf8" stroke="#0284c7" stroke-width="3">
        <title>cli.py::main</title>
      </circle>
      <text x="480" y="332" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">cli.py</text>

      <!-- diffmap -->
      <circle cx="200" cy="150" r="14" fill="#a855f7" stroke="#7e22ce" stroke-width="2">
        <title>diffmap.py::parse_diff</title>
      </circle>
      <text x="200" y="130" fill="#cbd5e1" font-size="11" text-anchor="middle">diffmap.py</text>

      <!-- graphio -->
      <circle cx="350" cy="120" r="14" fill="#6366f1" stroke="#4338ca" stroke-width="2">
        <title>graphio.py::load_graph</title>
      </circle>
      <text x="350" y="100" fill="#cbd5e1" font-size="11" text-anchor="middle">graphio.py</text>

      <!-- impact -->
      <circle cx="750" cy="100" r="14" fill="#ec4899" stroke="#be185d" stroke-width="2">
        <title>impact.py::compute_impact</title>
      </circle>
      <text x="750" y="80" fill="#cbd5e1" font-size="11" text-anchor="middle">impact.py</text>

      <!-- triage & llm -->
      <circle cx="600" cy="150" r="14" fill="#f59e0b" stroke="#d97706" stroke-width="2">
        <title>triage.py::select_and_rank_tests</title>
      </circle>
      <text x="600" y="130" fill="#cbd5e1" font-size="11" text-anchor="middle">triage.py</text>

      <!-- runner -->
      <circle cx="750" cy="200" r="14" fill="#10b981" stroke="#047857" stroke-width="2">
        <title>runner.py::run_tests</title>
      </circle>
      <text x="750" y="225" fill="#cbd5e1" font-size="11" text-anchor="middle">runner.py</text>

      <!-- report & map -->
      <circle cx="480" cy="450" r="14" fill="#06b6d4" stroke="#0891b2" stroke-width="2">
        <title>report.py & ripplemap.py</title>
      </circle>
      <text x="480" y="475" fill="#cbd5e1" font-size="11" text-anchor="middle">report / ripplemap</text>

      <!-- Test Nodes -->
      <circle cx="200" cy="450" r="12" fill="#22c55e" stroke="#15803d" stroke-width="2">
        <title>tests/test_diffmap.py</title>
      </circle>
      <text x="200" y="475" fill="#86efac" font-size="10" text-anchor="middle">test_diffmap</text>

      <circle cx="350" cy="480" r="12" fill="#22c55e" stroke="#15803d" stroke-width="2">
        <title>tests/test_impact.py</title>
      </circle>
      <text x="350" y="505" fill="#86efac" font-size="10" text-anchor="middle">test_impact</text>

      <circle cx="650" cy="480" r="12" fill="#22c55e" stroke="#15803d" stroke-width="2">
        <title>tests/test_triage.py</title>
      </circle>
      <text x="650" y="505" fill="#86efac" font-size="10" text-anchor="middle">test_triage</text>

      <circle cx="800" cy="450" r="12" fill="#22c55e" stroke="#15803d" stroke-width="2">
        <title>tests/test_cli_e2e.py</title>
      </circle>
      <text x="800" y="475" fill="#86efac" font-size="10" text-anchor="middle">test_cli_e2e</text>
    </svg>
  </div>
</body>
</html>
